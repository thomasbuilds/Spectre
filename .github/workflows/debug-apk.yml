name: Debug APK

on:
  pull_request:
    paths: [app/**, gradle/**, "*.gradle.kts", gradle.properties]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Assemble debug APK
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./gradlew :app:assembleDebug -Pcommit="${COMMIT_SHA:0:7}"

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spectre-debug.apk
          path: app/build/outputs/apk/debug/spectre-debug.apk
          if-no-files-found: error
          archive: false
          overwrite: true
          retention-days: 14
